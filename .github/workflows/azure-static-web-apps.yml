# Pipeline CI/CD del laboratorio serverless (adaptado a GCP: Firebase Hosting + Cloud Functions).
# Autenticación: TOKEN DE DESPLIEGUE en el secreto FIREBASE_TOKEN (equivalente a AZURE_STATIC_WEB_APPS_API_TOKEN).
name: CI/CD Serverless Lab

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # para que la acción comente la URL de preview en el PR
  checks: write

jobs:
  test:
    name: Pruebas de la API
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  build_and_deploy_job:
    name: Desplegar a Serverless (Sitio + API)
    needs: test
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias de la API
        working-directory: api
        run: npm install --no-audit --no-fund
      - name: Build y deploy (sitio + funciones)
        env:
          FIREBASE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'serverless-lab-penu7' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Error: No deployment token found in secret AZURE_STATIC_WEB_APPS_API_TOKEN"
            exit 1
          fi
          npm install -g firebase-tools
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANNEL_ID="pr-${{ github.event.pull_request.number }}"
            firebase hosting:channel:deploy "$CHANNEL_ID" --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --json > deploy_out.json
            PREVIEW_URL=$(node -e "const d= JSON.parse(require('fs').readFileSync('deploy_out.json','utf8')); const res = d.result || {}; const first = Object.values(res)[0] || {}; console.log(first.url || '');")
            echo "Preview URL: $PREVIEW_URL"
            if [ -n "$PREVIEW_URL" ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body "⚡ **Entorno de Preview desplegado:** $PREVIEW_URL"
            fi
          else
            firebase deploy --only functions,hosting --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --force
          fi

  close_pull_request_job:
    name: Cerrar entorno de preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Eliminar canal de preview
        env:
          FIREBASE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'serverless-lab-penu7' }}
        run: |
          npm install -g firebase-tools
          CHANNEL_ID="pr-${{ github.event.pull_request.number }}"
          firebase hosting:channel:delete "$CHANNEL_ID" --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --force
